<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy - PixelQuota</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#111418;background:#f4f6f8}body{max-width:820px;margin:0 auto;padding:54px 24px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:54px}a{color:inherit;text-decoration:none;font-weight:800}select{height:38px;border:1px solid #dfe4ea;border-radius:999px;background:#fff;padding:0 14px}h1{font-size:clamp(44px,7vw,72px);letter-spacing:-.055em;margin:0 0 24px}h2{font-size:20px;margin:34px 0 8px}p{font-size:15px;line-height:1.8;color:#5f6875;margin:0}.lead{font-size:18px}</style></head><body><header><a href="./index.html">← PixelQuota</a><select id="lang"><option value="en">EN</option><option value="zh-TW">繁中</option></select></header><main id="content"></main><script>const copy={en:{title:'Privacy',lead:'PixelQuota processes selected images locally in your browser. The image-processing pipeline does not upload your files to a PixelQuota server.',localH:'Local processing',localP:'Compression, resizing, conversion, previews, and ZIP creation happen on your device. Temporary browser objects are released when the page is closed or refreshed.',adsH:'Optional advertising',adsP:'If a site owner later enables third-party advertising, that service may receive ordinary webpage request data under its own policy. The selected image files are not passed to the advertising integration.',metaH:'Metadata',metaP:'When metadata removal is enabled, re-encoded files do not carry the original EXIF or GPS metadata. Keep the original if you need that information.'},'zh-TW':{title:'隱私說明',lead:'PixelQuota 會直接在瀏覽器本機處理你選擇的圖片。圖片處理流程不會把檔案上傳到 PixelQuota 伺服器。',localH:'本機處理',localP:'壓縮、縮放、轉檔、預覽與 ZIP 打包都在你的裝置上完成。關閉或重新整理頁面後，瀏覽器會釋放暫存的圖片物件。',adsH:'選用廣告',adsP:'如果網站擁有者日後啟用第三方廣告服務，該服務可能依自己的政策取得一般網頁請求資料；你選擇的圖片檔案不會傳給廣告整合服務。',metaH:'中繼資料',metaP:'啟用中繼資料移除後，重新輸出的檔案不會保留原始 EXIF 或 GPS 資訊。若你需要這些資訊，請保留原始檔。'}};const lang=document.getElementById('lang'),content=document.getElementById('content');function render(l){const c=copy[l]||copy.en;document.documentElement.lang=l;lang.value=l;content.innerHTML=`<h1>${c.title}</h1><p class="lead">${c.lead}</p><h2>${c.localH}</h2><p>${c.localP}</p><h2>${c.adsH}</h2><p>${c.adsP}</p><h2>${c.metaH}</h2><p>${c.metaP}</p>`;try{localStorage.setItem('pixelquota_lang',l)}catch{}}let initial='en';try{initial=localStorage.getItem('pixelquota_lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh-TW':'en')}catch{}lang.onchange=e=>render(e.target.value);render(initial);</script></body></html>
