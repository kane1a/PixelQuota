<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f9ff"><title>Privacy - PixelQuota</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17233d;background:#f5f8fd}*{box-sizing:border-box}body{max-width:880px;margin:0 auto;padding:44px 24px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:58px}a{color:inherit;text-decoration:none;font-weight:850}.brand{display:flex;align-items:center;gap:10px}.dot{width:30px;height:30px;border-radius:9px;background:#1f7cff;display:grid;place-items:center;color:#fff}.lang{position:relative}.lang-toggle{height:40px;min-width:84px;border:1px solid #d8e3f5;border-radius:12px;background:#fff;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#1f6df0;font-weight:850;cursor:pointer;box-shadow:0 5px 18px rgba(29,54,97,.08)}.lang-toggle:after{content:'⌄';font-size:13px}.lang-options{position:absolute;right:0;top:48px;z-index:10;width:168px;padding:6px;border:1px solid #d8e3f5;border-radius:14px;background:#fff;box-shadow:0 18px 42px rgba(23,48,94,.16)}.lang-options[hidden]{display:none}.lang-options button{width:100%;min-height:42px;border:0;border-radius:9px;background:transparent;padding:0 11px;display:flex;align-items:center;justify-content:center;color:#687894;font-size:11px;font-weight:850;cursor:pointer}.lang-options button:hover,.lang-options button.active{background:#edf4ff;color:#1f7cff}main{padding:36px;border:1px solid #dce7f7;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(35,62,111,.08)}h1{font-size:clamp(44px,7vw,72px);letter-spacing:-.055em;margin:0 0 24px}h2{font-size:20px;margin:34px 0 8px}p{font-size:15px;line-height:1.8;color:#5f6875;margin:0}.lead{font-size:18px;color:#4f5f79}@media(max-width:600px){body{padding:24px 16px 56px}header{margin-bottom:28px}main{padding:24px 20px}h1{font-size:44px}.lang-options{right:0}}</style></head><body><header><a class="brand" href="./index.html"><span class="dot">◆</span><span>PixelQuota</span></a><div class="lang"><button id="langToggle" class="lang-toggle" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="langValue">EN</span></button><div id="langOptions" class="lang-options" role="listbox" hidden><button data-locale="en">English</button><button data-locale="zh-TW">繁體中文</button><button data-locale="zh-CN">简体中文</button><button data-locale="ja">日本語</button><button data-locale="ko">한국어</button></div></div></header><main id="content"></main><script>const copy={en:{title:'Privacy',lead:'PixelQuota processes selected image bytes locally in your browser. Your image files are not uploaded to a PixelQuota server.',localH:'Local image processing',localP:'Compression, conversion, watermarking, redaction, cropping, previews, ZIP creation, and final background-removal composition happen on your device.',aiH:'AI model downloads',aiP:'AI Precision background removal may download BiRefNet Lite model files on first use. The browser can store those model files in local cache for reuse. Model files may use the network; your selected image bytes are not sent with them and are not uploaded to an inference API.',metaH:'Metadata',metaP:'When metadata removal is enabled, re-encoded files do not carry the original EXIF or GPS metadata. Keep the original if you need that information.',adsH:'Optional advertising',adsP:'If third-party advertising is enabled, that service may receive ordinary webpage request data under its own policy. Selected image files are not passed to the advertising integration.'},'zh-TW':{title:'隱私說明',lead:'PixelQuota 會直接在瀏覽器本機處理你選擇的圖片 bytes。圖片檔案不會上傳到 PixelQuota 伺服器。',localH:'本機圖片處理',localP:'壓縮、轉檔、浮水印、敏感遮蔽、社群裁切、預覽、ZIP 打包與最後的去背合成都在你的裝置上完成。',aiH:'AI 模型下載',aiP:'AI 精準去背第一次使用時可能需要下載 BiRefNet Lite 模型檔。瀏覽器可把模型檔保存在本機快取供之後重用。模型檔可以使用網路；你選擇的圖片 bytes 不會跟著傳送，也不會上傳到遠端推論 API。',metaH:'中繼資料',metaP:'啟用中繼資料移除後，重新輸出的檔案不會保留原始 EXIF 或 GPS 資訊。若你需要這些資訊，請保留原始檔。',adsH:'選用廣告',adsP:'如果日後啟用第三方廣告服務，該服務可能依自己的政策取得一般網頁請求資料；你選擇的圖片檔案不會傳給廣告整合服務。'},'zh-CN':{title:'隐私说明',lead:'PixelQuota 会直接在浏览器本地处理你选择的图片 bytes。图片文件不会上传到 PixelQuota 服务器。',localH:'本地图片处理',localP:'压缩、转换、水印、敏感遮挡、社交裁切、预览、ZIP 打包与最终去背合成都在你的设备上完成。',aiH:'AI 模型下载',aiP:'AI 精准去背首次使用时可能需要下载 BiRefNet Lite 模型文件。浏览器可将模型保存在本地缓存供之后复用。模型文件可以访问网络；你选择的图片 bytes 不会随之传输，也不会上传到远程推理 API。',metaH:'元数据',metaP:'启用元数据移除后，重新输出的文件不会保留原始 EXIF 或 GPS 信息。如需保留，请保存原始文件。',adsH:'可选广告',adsP:'如果启用第三方广告服务，该服务可能按自己的政策获取普通网页请求数据；你选择的图片文件不会传给广告集成。'},ja:{title:'プライバシー',lead:'PixelQuota は選択した画像データをブラウザ内で処理します。画像ファイルは PixelQuota のサーバーへアップロードされません。',localH:'ローカル画像処理',localP:'圧縮、変換、透かし、秘匿、ソーシャルクロップ、プレビュー、ZIP 作成、背景削除の最終合成は端末内で行われます。',aiH:'AI モデルの取得',aiP:'AI 高精度背景削除では初回に BiRefNet Lite のモデルファイルを取得する場合があります。モデルはブラウザのローカルキャッシュに保存して再利用できます。ネットワークを使うのはモデルファイルで、選択した画像データは送信されず、外部推論 API にアップロードされません。',metaH:'メタデータ',metaP:'メタデータ削除を有効にすると、再出力画像には元の EXIF / GPS 情報が含まれません。必要な場合は元画像を保管してください。',adsH:'任意の広告',adsP:'第三者広告を有効にした場合、通常のウェブリクエスト情報がその事業者のポリシーに従って扱われることがあります。選択した画像ファイルは広告連携へ渡しません。'},ko:{title:'개인정보 보호',lead:'PixelQuota는 선택한 이미지 데이터를 브라우저에서 로컬로 처리합니다. 이미지 파일은 PixelQuota 서버로 업로드되지 않습니다.',localH:'로컬 이미지 처리',localP:'압축, 변환, 워터마크, 민감정보 가리기, 소셜 크롭, 미리보기, ZIP 생성, 최종 배경 제거 합성은 기기에서 실행됩니다.',aiH:'AI 모델 다운로드',aiP:'AI 정밀 배경 제거는 처음 사용할 때 BiRefNet Lite 모델 파일을 다운로드할 수 있습니다. 브라우저는 모델을 로컬 캐시에 저장해 다시 사용할 수 있습니다. 네트워크를 쓰는 것은 모델 파일이며, 선택한 이미지 데이터는 함께 전송되거나 원격 추론 API로 업로드되지 않습니다.',metaH:'메타데이터',metaP:'메타데이터 제거를 켜면 재인코딩된 파일에 원본 EXIF / GPS 정보가 남지 않습니다. 필요한 경우 원본을 보관하세요.',adsH:'선택적 광고',adsP:'제3자 광고를 사용하는 경우 일반적인 웹 요청 정보가 해당 서비스 정책에 따라 처리될 수 있습니다. 선택한 이미지 파일은 광고 연동으로 전달되지 않습니다.'}};const compact={en:'EN','zh-TW':'繁中','zh-CN':'简中',ja:'日本語',ko:'한국어'},content=document.getElementById('content'),toggle=document.getElementById('langToggle'),value=document.getElementById('langValue'),options=document.getElementById('langOptions');function render(l){const c=copy[l]||copy.en;document.documentElement.lang=l;value.textContent=compact[l]||'EN';content.innerHTML=`<h1>${c.title}</h1><p class="lead">${c.lead}</p><h2>${c.localH}</h2><p>${c.localP}</p><h2>${c.aiH}</h2><p>${c.aiP}</p><h2>${c.metaH}</h2><p>${c.metaP}</p><h2>${c.adsH}</h2><p>${c.adsP}</p>`;[...options.children].forEach(b=>b.classList.toggle('active',b.dataset.locale===l));try{localStorage.setItem('pixelquota_lang',l)}catch{}}function close(){options.hidden=true;toggle.setAttribute('aria-expanded','false')}toggle.onclick=()=>{const next=!options.hidden;options.hidden=!next;toggle.setAttribute('aria-expanded',String(next))};options.onclick=e=>{const b=e.target.closest('[data-locale]');if(!b)return;render(b.dataset.locale);close()};document.addEventListener('pointerdown',e=>{if(!e.target.closest('.lang'))close()});let initial='en';try{const saved=localStorage.getItem('pixelquota_lang'),nav=(navigator.language||'').toLowerCase();initial=saved&&copy[saved]?saved:nav.startsWith('ja')?'ja':nav.startsWith('ko')?'ko':nav.startsWith('zh-cn')||nav.includes('hans')?'zh-CN':nav.startsWith('zh')?'zh-TW':'en'}catch{}render(initial);</script></body></html>
