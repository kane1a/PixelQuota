<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ece8e1" />
  <meta name="color-scheme" content="light" />
  <title>Privacy | PixelQuota</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ece8e1;
      --sheet: #f6f3ee;
      --line: #ddd7cd;
      --line-2: #c9c1b4;
      --ink: #2b2824;
      --ink-2: #5c5750;
      --ink-3: #636459;
      --accent: #2f6b66;
      --accent-ink: #f6f3ee;
      font-family: "Segoe UI Variable Text", "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; background: var(--bg); }
    body { min-width: 320px; margin: 0; padding: 40px 24px 56px; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { text-decoration: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .page-shell { width: min(920px, 100%); margin: 0 auto; }
    .icon-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; color: var(--ink); font-size: 16px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap; }
    .brand-icon { width: 28px; height: 28px; flex: none; color: var(--accent); }
    .language-menu { position: relative; z-index: 30; }
    .language-toggle { height: 40px; min-width: 88px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--sheet); color: var(--ink-2); font-size: 13px; }
    .language-toggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .language-options { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; width: min(220px, calc(100vw - 32px)); max-height: calc(100dvh - 24px); overflow-y: auto; padding: 4px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--sheet); box-shadow: 0 12px 28px rgba(43, 40, 36, .12); }
    .language-options[hidden] { display: none; }
    .language-options button { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); text-align: left; font-size: 14px; }
    .language-options button::after { content: "✓"; margin-left: auto; color: var(--accent); opacity: 0; }
    .language-options button[aria-selected="true"] { background: var(--bg); color: var(--ink); }
    .language-options button[aria-selected="true"]::after { opacity: 1; }
    .language-options button:hover { background: var(--bg); color: var(--ink); }
    main { max-width: 820px; margin: 0 auto; padding: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); box-shadow: 0 10px 32px rgba(43, 40, 36, .06); }
    h1 { margin: 0 0 16px; font-size: clamp(36px, 5vw, 54px); font-weight: 600; letter-spacing: -.055em; line-height: 1.08; }
    h2 { margin: 28px 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
    p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
    .lead { margin-bottom: 24px; color: var(--ink); font-size: 17px; line-height: 1.65; }
    @media (max-width: 760px) {
      body { padding: 24px 16px 40px; }
      header { margin-bottom: 24px; }
      main { padding: 24px 20px; border-radius: 12px; }
      .language-toggle { font-size: 13px; }
      .language-options button { font-size: 14px; }
      h1 { font-size: 36px; }
      p { font-size: 15px; }
      .lead { font-size: 16px; }
    }
  </style>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" focusable="false"><symbol id="brandMark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="24" rx="6.5" stroke-width="2.3"/><rect x="6.1" y="17" width="12.2" height="8.9" rx="1.6" fill="currentColor" stroke="none"/><path d="M22.2 11.2v14.6" stroke-width="2.3"/></symbol></svg>
  <div class="page-shell">
    <header>
      <a class="brand" href="./index.html" aria-label="PixelQuota home"><svg class="brand-icon" aria-hidden="true"><use href="#brandMark" /></svg><span>PixelQuota</span></a>
      <div class="language-menu">
        <button id="langToggle" class="language-toggle" type="button" aria-haspopup="listbox" aria-controls="langOptions" aria-expanded="false"><span id="langValue">EN</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 6 3.5 3.5L11.5 6" /></svg></button>
        <div id="langOptions" class="language-options" role="listbox" aria-label="Language" hidden>
          <button type="button" role="option" aria-selected="true" data-locale="en">English</button>
          <button type="button" role="option" aria-selected="false" data-locale="zh-TW">繁體中文</button>
          <button type="button" role="option" aria-selected="false" data-locale="zh-CN">简体中文</button>
          <button type="button" role="option" aria-selected="false" data-locale="ja">日本語</button>
          <button type="button" role="option" aria-selected="false" data-locale="ko">한국어</button>
        </div>
      </div>
    </header>
    <main id="content"></main>
  </div>
  <script>
    const copy = {
      en: {
        homeLabel: 'PixelQuota home', languageLabel: 'Language',
        title: 'Privacy', lead: 'PixelQuota processes selected image bytes locally in your browser. Your image files are not uploaded to a PixelQuota server.',
        localH: 'Local image processing', localP: 'Compression, conversion, watermarking, redaction, cropping, previews, ZIP creation, and final background-removal composition happen on your device.',
        aiH: 'AI model downloads', aiP: 'AI Precision downloads the BiRefNet Lite model from Hugging Face and its JavaScript/WebAssembly runtime from jsDelivr when needed. PixelQuota keeps only model weights and required model definitions in its persistent cache, not runtime resources. Selected image data stays on your device and is not sent to these providers or an inference API. The browser may manage its own internal network-resource cache, which the website cannot fully control.',
        metaH: 'Metadata', metaP: 'When metadata removal is enabled, re-encoded files do not carry the original EXIF or GPS metadata. Keep the original if you need that information.',
        adsH: 'Optional advertising', adsP: 'If third-party advertising is enabled, that service may receive ordinary webpage request data under its own policy. Selected image files are not passed to the advertising integration.'
      },
      'zh-TW': {
        homeLabel: '返回 PixelQuota', languageLabel: '語言',
        title: '隱私說明', lead: 'PixelQuota 會直接在瀏覽器本機處理你選擇的圖片資料。圖片檔案不會上傳到 PixelQuota 伺服器。',
        localH: '本機圖片處理', localP: '壓縮、轉檔、浮水印、敏感遮蔽、社群裁切、預覽、ZIP 打包與最後的去背合成都在你的裝置上完成。',
        aiH: 'AI 模型下載', aiP: 'AI 精準去背會視需要從 Hugging Face 下載 BiRefNet Lite 模型，並從 jsDelivr 取得 JavaScript／WebAssembly 執行階段。PixelQuota 管理的持久快取只保存模型權重與必要模型定義，不保存執行階段。你選擇的圖片資料留在裝置本機，不會傳給這些服務或遠端推論 API。瀏覽器可能自行管理網路資源的內部暫存，網站無法完全控制這些行為。',
        metaH: '中繼資料', metaP: '啟用中繼資料移除後，重新輸出的檔案不會保留原始 EXIF 或 GPS 資訊。若你需要這些資訊，請保留原始檔。',
        adsH: '選用廣告', adsP: '如果日後啟用第三方廣告服務，該服務可能依自己的政策取得一般網頁請求資料；你選擇的圖片檔案不會傳給廣告整合服務。'
      },
      'zh-CN': {
        homeLabel: '返回 PixelQuota', languageLabel: '语言',
        title: '隐私说明', lead: 'PixelQuota 会直接在浏览器本地处理你选择的图片数据。图片文件不会上传到 PixelQuota 服务器。',
        localH: '本地图片处理', localP: '压缩、转换、水印、敏感遮挡、社交裁切、预览、ZIP 打包与最终去背合成都在你的设备上完成。',
        aiH: 'AI 模型下载', aiP: 'AI 精准模式会按需从 Hugging Face 下载 BiRefNet Lite 模型，并从 jsDelivr 获取 JavaScript／WebAssembly 运行时。PixelQuota 管理的持久缓存仅保存模型权重和必要模型定义，不保存运行时资源。所选图片数据留在本地设备，不会发送给这些服务或远程推理 API。浏览器可能自行管理网络资源的内部缓存，网站无法完全控制这些行为。',
        metaH: '元数据', metaP: '启用元数据移除后，重新输出的文件不会保留原始 EXIF / GPS 信息。如需保留，请保存原始文件。',
        adsH: '可选广告', adsP: '如果启用第三方广告服务，该服务可能按自己的政策获取普通网页请求数据；你选择的图片文件不会传给广告集成。'
      },
      ja: {
        homeLabel: 'PixelQuota に戻る', languageLabel: '言語',
        title: 'プライバシー', lead: 'PixelQuota は選択した画像データをブラウザ内で処理します。画像ファイルは PixelQuota のサーバーへアップロードされません。',
        localH: 'ローカル画像処理', localP: '圧縮、変換、透かし、秘匿、ソーシャルクロップ、プレビュー、ZIP 作成、背景削除の最終合成は端末内で行われます。',
        aiH: 'AI モデルの取得', aiP: 'AI 高精度背景削除では、必要に応じて Hugging Face から BiRefNet Lite モデルを、jsDelivr から JavaScript／WebAssembly ランタイムを取得します。PixelQuota の永続キャッシュに保存するのはモデルの重みと必要なモデル定義のみで、ランタイムは保存しません。選択した画像データは端末内で処理され、これらのサービスや外部推論 API に送信されません。ブラウザ独自のネットワークリソース用キャッシュは、サイトから完全には制御できません。',
        metaH: 'メタデータ', metaP: 'メタデータ削除を有効にすると、再出力画像には元の EXIF / GPS 情報が含まれません。必要な場合は元画像を保管してください。',
        adsH: '任意の広告', adsP: '第三者広告を有効にした場合、通常のウェブリクエスト情報がその事業者のポリシーに従って扱われることがあります。選択した画像ファイルは広告連携へ渡しません。'
      },
      ko: {
        homeLabel: 'PixelQuota로 돌아가기', languageLabel: '언어',
        title: '개인정보 보호', lead: 'PixelQuota는 선택한 이미지 데이터를 브라우저에서 로컬로 처리합니다. 이미지 파일은 PixelQuota 서버로 업로드되지 않습니다.',
        localH: '로컬 이미지 처리', localP: '압축, 변환, 워터마크, 민감정보 가리기, 소셜 크롭, 미리보기, ZIP 생성, 최종 배경 제거 합성은 기기에서 실행됩니다.',
        aiH: 'AI 모델 다운로드', aiP: 'AI 정밀 배경 제거는 필요할 때 Hugging Face에서 BiRefNet Lite 모델을, jsDelivr에서 JavaScript／WebAssembly 런타임을 받습니다. PixelQuota의 영구 캐시에는 모델 가중치와 필요한 모델 정의만 저장하며 런타임은 저장하지 않습니다. 선택한 이미지 데이터는 기기에서 처리되며 이 서비스나 원격 추론 API로 전송되지 않습니다. 브라우저 자체의 네트워크 리소스 캐시는 웹사이트가 완전히 제어할 수 없습니다.',
        metaH: '메타데이터', metaP: '메타데이터 제거를 켜면 재인코딩된 파일에 원본 EXIF / GPS 정보가 남지 않습니다. 필요한 경우 원본을 보관하세요.',
        adsH: '선택적 광고', adsP: '제3자 광고를 사용하는 경우 일반적인 웹 요청 정보가 해당 서비스 정책에 따라 처리될 수 있습니다. 선택한 이미지 파일은 광고 연동으로 전달되지 않습니다.'
      }
    };
    const compact = { en: 'EN', 'zh-TW': '繁中', 'zh-CN': '简中', ja: '日本語', ko: '한국어' };
    const home = document.querySelector('.brand');
    if (location.protocol === 'file:') home.href = './PixelQuota.html';
    const content = document.getElementById('content');
    const toggle = document.getElementById('langToggle');
    const value = document.getElementById('langValue');
    const options = document.getElementById('langOptions');
    function render(locale) {
      const c = copy[locale] || copy.en;
      document.documentElement.lang = locale;
      home.setAttribute('aria-label', c.homeLabel);
      toggle.setAttribute('aria-label', c.languageLabel);
      options.setAttribute('aria-label', c.languageLabel);
      value.textContent = compact[locale] || 'EN';
      content.innerHTML = `<h1>${c.title}</h1><p class="lead">${c.lead}</p><h2>${c.localH}</h2><p>${c.localP}</p><h2>${c.aiH}</h2><p>${c.aiP}</p><h2>${c.metaH}</h2><p>${c.metaP}</p><h2>${c.adsH}</h2><p>${c.adsP}</p>`;
      options.querySelectorAll('[data-locale]').forEach(button => {
        const selected = button.dataset.locale === locale;
        button.setAttribute('aria-selected', String(selected));
      });
    }
    function closeMenu(restoreFocus = false) {
      if (options.hidden) return;
      options.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      if (restoreFocus) toggle.focus();
    }
    function openMenu() {
      options.hidden = false;
      toggle.setAttribute('aria-expanded', 'true');
      options.querySelector('[aria-selected="true"]')?.focus();
    }
    toggle.addEventListener('click', () => {
      if (options.hidden) openMenu();
      else closeMenu();
    });
    options.addEventListener('click', event => {
      const button = event.target.closest('[data-locale]');
      if (!button) return;
      render(button.dataset.locale);
      closeMenu(true);
    });
    options.addEventListener('keydown', event => {
      const buttons = [...options.querySelectorAll('[data-locale]')];
      const current = buttons.indexOf(document.activeElement);
      let next = current;
      if (event.key === 'ArrowDown') next = (current + 1 + buttons.length) % buttons.length;
      else if (event.key === 'ArrowUp') next = (current - 1 + buttons.length) % buttons.length;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = buttons.length - 1;
      else return;
      event.preventDefault();
      buttons[next]?.focus();
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('.language-menu')) closeMenu(true);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !options.hidden) {
        event.preventDefault();
        closeMenu(true);
      }
    });
    const browserLanguage = (navigator.languages?.[0] || navigator.language || '').toLowerCase();
    const initial = browserLanguage.startsWith('ja') ? 'ja'
      : browserLanguage.startsWith('ko') ? 'ko'
      : browserLanguage.startsWith('zh-cn') || browserLanguage.includes('hans') ? 'zh-CN'
      : browserLanguage.startsWith('zh') ? 'zh-TW' : 'en';
    render(initial);
  </script>
</body>
</html>
