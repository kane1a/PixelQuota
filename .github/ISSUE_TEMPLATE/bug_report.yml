name: Bug report
description: Report a reproducible PixelQuota problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not upload sensitive or private images.** Use a safe sample file or describe the input instead.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 153, Safari 20, Firefox 145...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS, Android, iOS...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include input format, requested KB, output format, and dimensions when relevant.
      placeholder: |
        1. Add a non-sensitive JPG...
        2. Set 100 KB...
        3. Click Process...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached sensitive or private image data.
          required: true
